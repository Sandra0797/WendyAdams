description.Spanish=Siguiente escenario para el proyecto Historias de Arkham. \n --------------------------------------------- \n Wendy Adams trata de dejar atrás su miserable vida organizando un plan de huída con un joven que ha conocido en el club donde trabaja. \n Ambos deciden llevarse a Dennis, quien se convirtió en la mejor amiga de Wendy desde que se conocieron en el club. \n Los tres deciden alojarse en un hotel abandonado que dirigía la familia Foster, pero allí Wendy descubrirá que la codicia por el poder de lo desconocido hace que las personas en las que más confías supongan un problema. \n\n <i>"Todos deberían saber que la codicia, el conocimiento y el poder pueden volver al más cuerdo, loco".</i> \n --------------------------------------------- \n *Es <color=red><b>obligatorio</b></color> escoger a la investigadora <b>Wendy Adams</b>. \n *Requiere únicamente el juego base de Mansiones de la locura 2ªEd. \n *Puede contener lenguaje soez. \n *Se recomienda hacer 3 acciones para avanzar en el escenario. \n 
description.English=A scenario for the "Arkham Stories" project. \n --------------------------------------------- \n Wendy Adams, desperate to leave her miserable life behind, devises an escape plan with a young man she met at the club where she works. \n They decide to bring along Dennis, Wendy's closest friend, bonded through their shared struggles at the club. \n The three decide to stay at an abandoned hotel run by the Foster family, But Wendy soon realizes that her trust may be misplaced; greed for power and the allure of forbidden knowledge begin to unravel her companions. \n\n <i>In the end, Wendy learns a hard truth: even the sanest mind can be driven to madness when tempted by power and ambition.</i>. \n -------------------------------------------- \n It's mandatory to use <b>Wendy Adams</b> investigator. \n It only requires Mansions of Madness, a second edition core box. \n May contain foul language. \n *"3 actions per turn" house rule is recommended to progress through the scenario.
description.Polish=Kolejny scenariusz zrealizowany w ramach projektu "Opowieści z Arkham".\n-----\nWendy Adams jest na najlepszej drodze, by porzucić swoje nieszczęśliwe życie organizując plan ucieczki z młodym mężczyzną, którego poznała w klubie, w którym pracuje.\nOboje decydują się zabrać Denise, przyjaciółkę z pracy.\nCała trójka postanawia zatrzymać się w opuszczonym hotelu prowadzonym niegdyś przez rodzinę Fosterów. Tam Wendy odkrywa, że żądza zdobycia tajemnej mocy może zniszczyć nawet najmocniejsze więzi.\n\n<i>"Niechaj każdemu będzie wiadome, że chciwość, władza i żądza wiedzy mogą doprowadzić do szaleństwa nawet najrozsądniejszą osobę."</i>\n-----\n*Scenariusz jest przeznaczony <color=red><b>wyłącznie</b></color> do gry w pojedynkę z badaczką <b>Wendy Adams</b>.\n*Do rozgrywki wymagana jest podstawowa gra Posiadłość Szaleństwa.\n*Scenariusz może zawierać wulgaryzmy.\n*W toku rozgrywki zalecane jest wykonywanie <b>trzech</b> akcji na turę.\n
